openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Tesla Lightshow at COTA RSVP
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rsvp
    description: RSVP operations
  - name: rsvp-monthly
    description: Monthly Long Center RSVP operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /rsvps-monthly:
    post:
      operationId: createMonthlyRsvp
      tags: [rsvp-monthly]
      summary: Create a Monthly Long Center RSVP
      description: Submit an RSVP for the Long Center Monthly Residency event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRsvpBody"
      responses:
        "201":
          description: RSVP created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rsvp"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listMonthlyRsvps
      tags: [rsvp-monthly]
      summary: List Monthly Long Center RSVPs
      description: Get total count and list of monthly Long Center RSVPs
      responses:
        "200":
          description: RSVP list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpList"
  /rsvps:
    post:
      operationId: createRsvp
      tags: [rsvp]
      summary: Create an RSVP
      description: Submit an RSVP for the Tesla Lightshow at COTA event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRsvpBody"
      responses:
        "201":
          description: RSVP created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rsvp"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listRsvps
      tags: [rsvp]
      summary: List RSVPs
      description: Get total count of RSVPs
      responses:
        "200":
          description: RSVP list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpList"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CreateRsvpBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        guests:
          type: integer
          minimum: 1
          maximum: 10
        message:
          type: string
          maxLength: 500
      required:
        - name
        - email
        - guests
    Rsvp:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        guests:
          type: integer
        message:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - guests
        - createdAt
    RsvpList:
      type: object
      properties:
        total:
          type: integer
        rsvps:
          type: array
          items:
            $ref: "#/components/schemas/Rsvp"
      required:
        - total
        - rsvps
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
